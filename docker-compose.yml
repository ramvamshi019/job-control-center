# ---- Job Control Center : 24/7 cloud stack ----
# Three long-running services sharing ONE SQLite DB on a named volume.
# `restart: unless-stopped` is the cloud equivalent of launchd KeepAlive — and a
# cloud host never sleeps, which is the whole point (no more overnight gaps).
#
#   backend    FastAPI API            :8000
#   livewatch  the 24/7 crawler  <-- the service that must never stop
#   dashboard  Streamlit UI            :8501
#
# First run:  docker compose up -d --build
# See DEPLOY.md for seeding / uploading the database and securing the ports.

services:
  backend:
    build: .
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////app/backend/data/db/jobs.db
    volumes:
      - jcc-data:/app/backend/data/db
    ports:
      # localhost-only: the API has no auth and Docker bypasses ufw. Reach it
      # via SSH tunnel, never the public internet. (dashboard talks to it over
      # the internal docker network, so it needs no public port at all.)
      - "127.0.0.1:8000:8000"
    # Fenced like the crawlers. Un-capped, one heavy /jobs/ query (the Posted
    # Today net pulls ~2.6k rows WITH descriptions every 20s) could balloon
    # uvicorn until the KERNEL OOM-killer fires and shoots an arbitrary victim —
    # sshd or the crawler. With a cap, a runaway can only kill itself and
    # `restart: unless-stopped` brings it straight back. Steady state is ~180 MB.
    # 2026-07-27: box resized 2->4 vCPU / 2->8 GB; caps raised to match.
    mem_limit: 1500m
    memswap_limit: 2g
    restart: unless-stopped

  livewatch:
    build: .
    working_dir: /app/backend
    # 2026-07-27: box resized to 4 vCPU / 8 GB — pushed harder (was 90/100/6 on
    # the 2-vCPU box). More workers + bigger batch ~doubles crawl throughput to
    # absorb the expanded company roster; still leaves ~1.5 vCPU for the API.
    command: python scripts/live_watch.py --interval 60 --batch 200 --workers 12
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////app/backend/data/db/jobs.db
    volumes:
      - jcc-data:/app/backend/data/db
    # Hard fence so a heavy crawl wave can never starve the API. Symptom it
    # fixes: during a `due=100 found=~9000` cycle the box (2 vCPU / 2 GB, with
    # ~800 MB already in swap) starved uvicorn, and an 80ms GET /jobs/ blew past
    # the dashboard's HTTP timeout -> "Read timed out" in the UI. Leaving ~0.8
    # vCPU and the RAM for backend+dashboard keeps the API responsive; the
    # crawler just takes a little longer per wave. Coverage is unchanged.
    cpus: 2.5            # 4-vCPU box: leave ~1.5 vCPU for backend + dashboard
    mem_limit: 2g
    memswap_limit: 3g   # cap swap too, else the limit just pushes it to disk
    restart: unless-stopped
    depends_on: [backend]

  # Grows the COMPANY list, which livewatch never does — it only pulls new jobs
  # from companies already known. Without this the roster stayed frozen from the
  # initial seed (2026-06-17) for over a month. Sleeps ~all week, so its cost is
  # a few minutes of network per pass; capped anyway so it can't disturb the API.
  discovery:
    build: .
    working_dir: /app/backend
    # --seed-file: on each weekly pass, also ingest the JSONL produced by
    # harvest_company_sources.py. Fingerprints websites for hidden ATS
    # tenants; name-probes anything new against the 9 token APIs.
    command: python scripts/auto_discover.py --loop --every-hours 168 --workers 24 --seed-file data/discovered_companies.jsonl
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////app/backend/data/db/jobs.db
    volumes:
      - jcc-data:/app/backend/data/db
    cpus: 1
    mem_limit: 700m
    memswap_limit: 1g
    restart: unless-stopped
    depends_on: [backend]

  dashboard:
    build: .
    working_dir: /app
    command: >
      streamlit run dashboard/app.py
      --server.port 8501 --server.address 0.0.0.0 --server.headless true
      --server.enableCORS false --server.enableXsrfProtection false
    environment:
      - API_BASE_URL=http://backend:8000
      # "Posted Today" / "fresh today" are computed in THIS zone, not the
      # container's UTC. Change here if Ram relocates.
      - JCC_LOCAL_TZ=America/Chicago
    ports:
      # localhost-only: no login on the dashboard. Access via SSH tunnel:
      #   ssh -L 8501:localhost:8501 root@<vps-ip>  → open http://localhost:8501
      - "127.0.0.1:8501:8501"
    # Streamlit keeps per-session state and this page auto-refreshes every 20s;
    # a long-lived browser tab is the classic slow leak. Capped so it restarts
    # itself instead of taking the box with it. Steady state is ~150 MB.
    mem_limit: 500m
    memswap_limit: 800m
    restart: unless-stopped
    depends_on: [backend]

volumes:
  jcc-data:
