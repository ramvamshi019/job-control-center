# ---- Job Control Center : 24/7 cloud stack ----
# Three long-running services sharing ONE SQLite DB on a named volume.
# `restart: unless-stopped` is the cloud equivalent of launchd KeepAlive — and a
# cloud host never sleeps, which is the whole point (no more overnight gaps).
#
#   backend    FastAPI API            :8000
#   livewatch  the 24/7 crawler  <-- the service that must never stop
#   dashboard  Streamlit UI            :8501
#
# First run:  docker compose up -d --build
# See DEPLOY.md for seeding / uploading the database and securing the ports.

services:
  backend:
    build: .
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////app/backend/data/db/jobs.db
    volumes:
      - jcc-data:/app/backend/data/db
    ports:
      # localhost-only: the API has no auth and Docker bypasses ufw. Reach it
      # via SSH tunnel, never the public internet. (dashboard talks to it over
      # the internal docker network, so it needs no public port at all.)
      - "127.0.0.1:8000:8000"
    # Fenced like the crawlers. Un-capped, one heavy /jobs/ query (the Posted
    # Today net pulls ~2.6k rows WITH descriptions every 20s) could balloon
    # uvicorn until the KERNEL OOM-killer fires and shoots an arbitrary victim —
    # sshd or the crawler. With a cap, a runaway can only kill itself and
    # `restart: unless-stopped` brings it straight back. Steady state is ~180 MB.
    # 2026-07-27: box resized 2->4 vCPU / 2->8 GB; caps raised to match.
    mem_limit: 1500m
    memswap_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      # Watched by the autoheal container below — auto-restart when unhealthy
      - autoheal=true

  livewatch:
    build: .
    working_dir: /app/backend
    # 2026-07-27: box resized to 4 vCPU / 8 GB — pushed harder (was 90/100/6 on
    # the 2-vCPU box). More workers + bigger batch ~doubles crawl throughput to
    # absorb the expanded company roster; still leaves ~1.5 vCPU for the API.
    # 2026-07-30: bumped 12→16 workers + 60→30s interval → ~2x sweep rate
    # on the same 38k active pool. Still under the 2.5 CPU cap; API rate-
    # limits (Greenhouse/Lever/Workday) are the real ceiling, not our
    # concurrency. Batch stays 200 so a single cycle doesn't eat memory.
    command: python scripts/live_watch.py --interval 30 --batch 200 --workers 16
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////app/backend/data/db/jobs.db
    volumes:
      - jcc-data:/app/backend/data/db
    # Hard fence so a heavy crawl wave can never starve the API. Symptom it
    # fixes: during a `due=100 found=~9000` cycle the box (2 vCPU / 2 GB, with
    # ~800 MB already in swap) starved uvicorn, and an 80ms GET /jobs/ blew past
    # the dashboard's HTTP timeout -> "Read timed out" in the UI. Leaving ~0.8
    # vCPU and the RAM for backend+dashboard keeps the API responsive; the
    # crawler just takes a little longer per wave. Coverage is unchanged.
    cpus: 2.5            # 4-vCPU box: leave ~1.5 vCPU for backend + dashboard
    mem_limit: 2g
    memswap_limit: 3g   # cap swap too, else the limit just pushes it to disk
    restart: unless-stopped
    depends_on: [backend]

  # Grows the COMPANY list, which livewatch never does — it only pulls new jobs
  # from companies already known. Without this the roster stayed frozen from the
  # initial seed (2026-06-17) for over a month. Now a *multi-source* loop
  # (discovery_loop.py) running each source at its own useful cadence:
  #   HN Job Stories       every 10 min  (~30-item rolling live feed)
  #   HN Who Is Hiring     every  6 hrs  (catches new posts to current thread)
  #   YC directory         every 24 hrs  (yc-oss/api mirror, refreshed daily)
  #   Weekly harvest       every  7 days (existing auto_discover + maintenance)
  # Sources are all idempotent, memory-bounded (rolling futures window), and
  # each is try/except-guarded so one broken source can't take down the loop.
  discovery:
    build: .
    working_dir: /app/backend
    command: python scripts/discovery_loop.py
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////app/backend/data/db/jobs.db
    volumes:
      - jcc-data:/app/backend/data/db
    cpus: 1
    # 2026-07-30: bumped 700m → 1500m. auto_discover fingerprint scan OOM'd
    # at ~2900/6658 candidates loading company HTML into memory. New cap lets
    # the full scan complete + surfaces Oracle HCM / SuccessFactors / Taleo /
    # etc. tenants that would otherwise stay dormant.
    mem_limit: 1500m
    memswap_limit: 2g
    restart: unless-stopped
    depends_on: [backend]

  dashboard:
    build: .
    working_dir: /app
    command: >
      streamlit run dashboard/app.py
      --server.port 8501 --server.address 0.0.0.0 --server.headless true
      --server.enableCORS false --server.enableXsrfProtection false
    # Give dashboard read access to the backend .env so it can call the
    # Anthropic API directly (Interview Prep page uses it). No harm --
    # same trust boundary as backend, both containers run root on the
    # same droplet from the same image.
    env_file: ./backend/.env
    environment:
      - API_BASE_URL=http://backend:8000
      # "Posted Today" / "fresh today" are computed in THIS zone, not the
      # container's UTC. Change here if Ram relocates.
      - JCC_LOCAL_TZ=America/Chicago
    ports:
      # localhost-only: no login on the dashboard. Access via SSH tunnel:
      #   ssh -L 8501:localhost:8501 root@<vps-ip>  → open http://localhost:8501
      - "127.0.0.1:8501:8501"
    # Streamlit keeps per-session state and this page auto-refreshes every 20s;
    # a long-lived browser tab is the classic slow leak. Capped so it restarts
    # itself instead of taking the box with it. Steady state is ~150 MB.
    mem_limit: 500m
    memswap_limit: 800m
    restart: unless-stopped
    depends_on: [backend]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true

  # willfarrell/autoheal watches for containers with label autoheal=true whose
  # HEALTHCHECK reports 'unhealthy' → docker restart them. `restart: unless-
  # stopped` alone doesn't catch 'up but broken' cases (uvicorn hung, streamlit
  # deadlocked, event loop stuck) — it only restarts crashed processes. This
  # closes that gap.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: jcc-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15         # check every 15s
      - AUTOHEAL_START_PERIOD=60     # ignore during boot
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jcc-data:
