<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>JCC Autofill</title>
  <style>
    body {
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0; padding: 16px;
      width: 360px;
      background: #fafafa;
    }
    h1 { font-size: 16px; margin: 0 0 12px 0; color: #333; }
    .status {
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .status.ok { background: #d1f0d1; color: #1a7f37; }
    .status.warn { background: #fef3c7; color: #92400e; }
    .status.err { background: #fee2e2; color: #b91c1c; }
    button {
      width: 100%; padding: 10px 12px;
      background: #0969da; color: white; border: none;
      border-radius: 6px; font-weight: 600; font-size: 14px;
      cursor: pointer; margin-bottom: 8px;
    }
    button:hover { background: #0854b3; }
    button.secondary { background: #e5e7eb; color: #333; }
    button.secondary:hover { background: #d1d5db; }
    .result {
      background: #fff; border: 1px solid #ddd;
      border-radius: 4px; padding: 8px 10px;
      font-size: 12px; margin-top: 8px;
      max-height: 100px; overflow: auto;
    }
    details { margin-top: 12px; }
    summary { cursor: pointer; font-size: 12px; color: #666; }
    .field { display: grid; grid-template-columns: 100px 1fr; gap: 6px; margin-bottom: 6px; }
    .field label { font-size: 12px; color: #666; align-self: center; }
    .field input {
      padding: 4px 6px; border: 1px solid #ccc; border-radius: 3px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>🎯 JCC Autofill</h1>
  <div id="status" class="status warn">Checking page…</div>

  <button id="fill-btn" disabled>⚡ Fill this application</button>
  <button id="settings-btn" class="secondary">⚙️ Edit profile</button>

  <div id="result" class="result" style="display:none"></div>

  <details id="settings-panel" style="display:none">
    <summary style="display:none"></summary>
    <div id="profile-fields"></div>
    <button id="save-btn" style="margin-top:8px">💾 Save profile</button>
  </details>

  <script src="popup.js"></script>
</body>
</html>
